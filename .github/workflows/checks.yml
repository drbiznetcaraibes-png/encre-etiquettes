name: Tests
on: [push, pull_request]
jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -r requirements.txt
      - run: python -m unittest discover -s tests -v
      - run: python maintenance.py import
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --prefix /tmp/sqlcheck --no-audit --no-fund @electric-sql/pglite@0.5.15
      - run: node tests/check_schema.cjs
        env:
          PGLITE_MODULE: /tmp/sqlcheck/node_modules/@electric-sql/pglite
      - run: npm install --prefix /tmp/browsercheck --no-audit --no-fund playwright@1.62.1
      - run: /tmp/browsercheck/node_modules/.bin/playwright install --with-deps chromium
      - name: Tester le gabarit et l'impression dans Chromium
        env:
          APP_ACCESS_TOKEN: browser-test
          PLAYWRIGHT_MODULE: /tmp/browsercheck/node_modules/playwright
        run: |
          uvicorn server:app --host 127.0.0.1 --port 8002 > /tmp/encre-server.log 2>&1 &
          for attempt in $(seq 1 30); do
            if curl --fail --silent http://127.0.0.1:8002/health; then break; fi
            sleep 1
          done
          node tests/check_labels.cjs
